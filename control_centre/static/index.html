<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Libby Control Centre</title>
<style>
  :root {
    color-scheme: dark;
    --neon: #10dd8f;
    --neon-dim: #1fbd85;
    --neon-glow: rgba(16, 221, 143, 0.25);
    --ink: #f1fbf5;
    --muted: #a5c9b6;
    --border: #1c3a2d;
    --border-bright: #275842;
    --card: #0c1a14;
    --bg: #071410;
    --bg2: #0a1a14;
    --red: #ff7a86;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--border-bright) var(--bg); }
  body {
    font-family: var(--font-ui);
    font-size: 15px;
    margin: 0; padding: 28px 32px 60px;
    background:
      linear-gradient(rgba(16,221,143,.018) 1px, transparent 1px) 0 0 / 100% 24px,
      radial-gradient(circle at 12% -10%, rgba(16,221,143,.06), transparent 45%),
      var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  h1 {
    font-family: var(--font-mono);
    font-size: 19px; margin: 0; color: var(--neon); letter-spacing: .01em;
  }
  h1 .caret { display: inline-block; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 26px; }
  section {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 18px 20px; margin-bottom: 18px;
    box-shadow: 0 0 0 1px rgba(16,221,143,.02), 0 12px 30px rgba(0,0,0,.4);
  }
  h2 {
    font-family: var(--font-mono);
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--neon-dim); margin: 0 0 14px; font-weight: 700;
  }
  h2::before { content: "// "; color: var(--border-bright); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th {
    font-family: var(--font-mono);
    color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase;
    letter-spacing: .04em; position: sticky; top: 0; background: var(--bg2);
    cursor: pointer; user-select: none;
  }
  th:hover { color: var(--neon-dim); }
  th.sorted { color: var(--neon); }
  th .arrow { color: var(--neon); margin-left: 3px; }
  tbody tr:hover { background: rgba(16, 221, 143, .06); }
  td.mark-yes { color: var(--neon); font-weight: 700; }
  td.mark-no { color: #4c6d58; }
  .table-wrap { max-height: 520px; overflow-y: auto; border-radius: 6px; border: 1px solid var(--border); }
  .filter-row { margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }
  .filter-row input {
    padding: 8px 12px; font-size: 13.5px; width: 280px; border: 1px solid var(--border);
    border-radius: 5px; background: var(--bg2); color: var(--ink); font-family: inherit;
  }
  .filter-row input:focus { outline: none; border-color: var(--neon-dim); box-shadow: 0 0 0 3px var(--neon-glow); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  select {
    font-size: 13.5px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg2); color: var(--ink); font-family: inherit;
  }
  .area-picker { position: relative; }
  .area-picker input {
    font-size: 13.5px; padding: 8px 30px 8px 12px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg2); width: 280px; color: var(--ink); font-family: inherit;
  }
  .area-picker input:focus { outline: none; border-color: var(--neon-dim); box-shadow: 0 0 0 3px var(--neon-glow); }
  .area-picker::after {
    content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; font-size: 11px;
  }
  .suggestions {
    position: absolute; top: 100%; left: 0; margin-top: 4px; width: 340px; max-height: 340px;
    overflow-y: auto; background: var(--bg2); border: 1px solid var(--border-bright); border-radius: 6px;
    box-shadow: 0 12px 30px rgba(0,0,0,.6), 0 0 20px rgba(0,230,154,.08); z-index: 10; display: none;
  }
  .suggestions.open { display: block; }
  .suggestions div { padding: 8px 12px; font-size: 13.5px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .suggestions div:hover, .suggestions div.active { background: rgba(0, 230, 154, .1); color: var(--neon); }
  .suggestions .type-tag { color: var(--muted); font-size: 11.5px; }
  .suggestions .none { color: var(--muted); font-style: italic; cursor: default; }
  button.run {
    background: var(--neon); color: #04140d; border: none; border-radius: 6px;
    padding: 8px 22px; cursor: pointer; font-size: 13px; font-weight: 700;
    font-family: var(--font-ui); letter-spacing: .01em;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  button.run:hover { background: #33f2b5; }
  button.run:disabled { background: #2b4238; color: #6f9382; box-shadow: none; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; color: var(--neon-dim); border: 1px solid var(--border-bright);
    border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 600;
    font-family: var(--font-ui);
  }
  .btn-secondary:hover { border-color: var(--neon); color: var(--neon); background: rgba(16,221,143,.06); }
  .log-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .log-head h2 { margin: 0; }
  .btn-danger {
    background: transparent; color: var(--red); border: 1px solid #5a2530;
    border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 12.5px; font-weight: 700;
    font-family: var(--font-ui);
  }
  .btn-danger:hover:not(:disabled) { background: rgba(255,122,134,.1); border-color: var(--red); }
  .btn-danger:disabled { color: #4a3a3d; border-color: var(--border); cursor: not-allowed; }
  .stdin-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .stdin-prompt { color: var(--neon-dim); font-family: var(--font-mono); font-weight: 700; }
  .stdin-row input {
    flex: 1; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border);
    border-radius: 5px; background: var(--bg2); color: var(--ink); font-family: var(--font-mono);
  }
  .stdin-row input:focus { outline: none; border-color: var(--neon-dim); box-shadow: 0 0 0 3px var(--neon-glow); }
  .stdin-row input:disabled { color: var(--muted); cursor: not-allowed; }
  .stdin-row .btn-secondary:disabled { color: #4a5a52; border-color: var(--border); cursor: not-allowed; }
  label.chk { font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
  label.chk input { accent-color: var(--neon); width: 14px; height: 14px; }
  #log {
    background: #04100b; color: var(--ink); font-family: var(--font-mono);
    font-size: 13px; line-height: 1.6; padding: 16px; border-radius: 8px; height: 340px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word; border: 1px solid var(--border);
  }
  #log .cmd { color: var(--neon); font-weight: 600; }
  #log .exit-bad { color: var(--red); }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .cmd-preview {
    margin-top: 12px; padding: 10px 13px; border: 1px dashed var(--border-bright);
    border-radius: 5px; background: var(--bg2); color: var(--neon-dim);
    font-family: var(--font-mono); font-size: 13px; white-space: pre-wrap; word-break: break-word;
  }
  .cmd-preview.pending { color: var(--muted); font-style: italic; font-family: var(--font-ui); }
  .cmd-preview.err { color: var(--red); border-color: var(--red); }
  .badge {
    display: inline-block; font-size: 11.5px; padding: 3px 9px; border-radius: 3px;
    background: rgba(0,230,154,.1); color: var(--neon); margin-left: 8px; font-weight: 600;
    border: 1px solid var(--border-bright);
  }
  .tab-link {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--neon-dim); font-size: 13px; font-weight: 600; font-family: var(--font-ui);
    text-decoration: none; border: 1px solid var(--border-bright); border-radius: 7px;
    padding: 7px 16px; background: var(--card);
  }
  .tab-link:hover { color: var(--neon); border-color: var(--neon); background: rgba(16,221,143,.06); }
  .tab-link .arrow { font-size: 11px; }
</style>
</head>
<body>

<header>
  <h1>&gt; libby control centre<span class="caret">_</span></h1>
  <a class="tab-link" href="/group-log" target="_blank">Group log <span class="arrow">↗</span></a>
</header>
<div class="sub">Every action below runs a real local command — the exact command is always shown in the log before it executes.</div>

<section>
  <h2>Run an action</h2>
  <div class="controls">
    <div>
      <select id="actionSelect"></select>
    </div>
    <div class="area-picker" id="areaPicker">
      <input id="areaInput" placeholder="Click to browse, or type to search..." autocomplete="off">
      <div class="suggestions" id="areaSuggestions"></div>
    </div>
    <span id="paramBox"></span>
    <button class="btn-secondary" id="pickNextBtn" type="button" title="Next constituency not yet generated/pushed">Pick next</button>
    <button class="btn-secondary" id="pick5Btn" type="button" title="Next 5 constituencies not yet generated/pushed">Pick 5</button>
    <button class="run" id="runBtn">Run</button>
  </div>
  <div class="hint" id="actionHint"></div>
  <div class="hint" id="bulkList" style="display:none"></div>
  <div id="cmdPreview" class="cmd-preview">$ …</div>
</section>

<section>
  <div class="log-head">
    <h2>Command log</h2>
    <button class="btn-danger" id="killBtn" type="button" disabled>■ Stop</button>
  </div>
  <div id="log">(nothing run yet)</div>
  <div class="stdin-row">
    <span class="stdin-prompt">&gt;</span>
    <input id="stdinInput" placeholder="Send input to the running command (e.g. press Enter for a login prompt)..." disabled autocomplete="off">
    <button class="btn-secondary" id="stdinSendBtn" type="button" disabled>Send</button>
  </div>
</section>

<section>
  <h2>Status <span class="badge" id="areaCount"></span></h2>
  <div class="filter-row">
    <input id="filterBox" placeholder="Search all constituencies + wards...">
    <select id="typeFilter">
      <option value="">All types</option>
      <option value="constituency">Constituency</option>
      <option value="ward">Ward</option>
    </select>
    <label class="chk"><input type="checkbox" id="showAllToggle"> show all (incl. untouched)</label>
    <span class="hint" id="sortHint"></span>
  </div>
  <div class="table-wrap">
    <table id="statusTable">
      <thead>
        <tr id="statusHeadRow"></tr>
      </thead>
      <tbody id="statusBody"></tbody>
    </table>
  </div>
</section>

<script>
let AREAS = [];
let ACTIONS = [];
let SELECTED_SLUG = null;
let BULK_NAMES = [];

const PARAM_DEFS = {
  prep: [{key: "force", label: "--force"}],
  prep_bulk: [{key: "force", label: "--force"}],
  push: [],
  pull: [],
  pull_about: [],
  run_pipeline: [
    {key: "context", label: "--context"},
    {key: "about", label: "--about"},
    {key: "stop_before_ai_assessment", label: "--stop-before-ai-assessment"},
    {key: "force", label: "--force (reprocess even if already done — constituencies only)"},
  ],
  set_scrape_target: [{key: "force", label: "--force"}],
  view_scrape_target: [],
  pick_next_scrape_target: [{key: "dry_run", label: "--dry-run"}],
  set_about_target: [{key: "force", label: "--force"}],
  pick_next_about_target: [{key: "dry_run", label: "--dry-run"}],
  run_remote_scrape: [],
};

function mark(v) { return `<td class="${v ? 'mark-yes' : 'mark-no'}">${v ? '✓' : '–'}</td>`; }

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => (
    {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]
  ));
}

function isTouched(a) {
  return a.generated || a.pushed || a.scraped || a.about || a.processed || a.staged || a.promoted;
}

// "Not yet generated/pushed" = still a candidate for prep — constituencies
// only (prep is constituency-only, see actions.py's _build_prep). Sorted
// alphabetically for a deterministic "next" across repeated clicks.
function nextUntouchedConstituencies(n) {
  return AREAS
    .filter(a => a.type === "constituency" && (!a.generated || !a.pushed))
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name))
    .slice(0, n);
}

function renderBulkList() {
  const box = document.getElementById("bulkList");
  const isBulk = currentAction() && currentAction().id === "prep_bulk";
  if (!isBulk) { box.style.display = "none"; return; }
  box.style.display = "";
  box.textContent = BULK_NAMES.length
    ? `Picked: ${BULK_NAMES.join(", ")}`
    : `Click "Pick 5" to choose the next 5 un-generated/un-pushed constituencies.`;
}

function pickNext() {
  const candidates = nextUntouchedConstituencies(1);
  if (candidates.length === 0) {
    appendLog("Nothing to pick — every constituency is already generated and pushed.\n", "exit-bad");
    return;
  }
  document.getElementById("actionSelect").value = "prep";
  BULK_NAMES = [];
  updateAreaPickerVisibility();
  updatePickButtonsVisibility();
  renderParamBox();
  SELECTED_SLUG = candidates[0].slug;
  document.getElementById("areaInput").value = candidates[0].name;
  renderBulkList();
  updatePreview();
}

function pick5() {
  const candidates = nextUntouchedConstituencies(5);
  if (candidates.length === 0) {
    appendLog("Nothing to pick — every constituency is already generated and pushed.\n", "exit-bad");
    return;
  }
  document.getElementById("actionSelect").value = "prep_bulk";
  BULK_NAMES = candidates.map(a => a.name);
  SELECTED_SLUG = null;
  updateAreaPickerVisibility();
  updatePickButtonsVisibility();
  renderParamBox();
  renderBulkList();
  updatePreview();
}

const STATUS_COLUMNS = [
  {key: "name", label: "Area", kind: "string"},
  {key: "type", label: "Type", kind: "string"},
  {key: "generated", label: "Generated", kind: "bool"},
  {key: "pushed", label: "Pushed", kind: "bool"},
  {key: "scraped", label: "Scraped", kind: "bool"},
  {key: "about", label: "About", kind: "bool"},
  {key: "processed", label: "Processed", kind: "bool"},
  {key: "staged", label: "Staged", kind: "bool"},
  {key: "promoted", label: "Promoted", kind: "bool"},
];
let SORT_KEY = "name";
let SORT_DIR = 1; // 1 = ascending, -1 = descending

function setSort(key) {
  const col = STATUS_COLUMNS.find(c => c.key === key);
  if (SORT_KEY === key) {
    SORT_DIR *= -1;
  } else {
    SORT_KEY = key;
    // Boolean columns default to "checked first" (descending); text columns A-Z.
    SORT_DIR = col.kind === "bool" ? -1 : 1;
  }
  renderStatus(document.getElementById("filterBox").value);
}

function compareRows(a, b) {
  const col = STATUS_COLUMNS.find(c => c.key === SORT_KEY);
  let va = a[SORT_KEY], vb = b[SORT_KEY];
  if (col.kind === "bool") {
    va = va ? 1 : 0; vb = vb ? 1 : 0;
  } else {
    va = String(va).toLowerCase(); vb = String(vb).toLowerCase();
  }
  if (va < vb) return -1 * SORT_DIR;
  if (va > vb) return 1 * SORT_DIR;
  return a.name.localeCompare(b.name);
}

function renderStatusHead() {
  const row = document.getElementById("statusHeadRow");
  row.innerHTML = STATUS_COLUMNS.map(c => {
    const sorted = c.key === SORT_KEY;
    const arrow = sorted ? `<span class="arrow">${SORT_DIR === 1 ? "▲" : "▼"}</span>` : "";
    return `<th data-key="${c.key}" class="${sorted ? 'sorted' : ''}">${c.label}${arrow}</th>`;
  }).join("");
  row.querySelectorAll("th").forEach(th => th.addEventListener("click", () => setSort(th.dataset.key)));

  const col = STATUS_COLUMNS.find(c => c.key === SORT_KEY);
  document.getElementById("sortHint").textContent =
    `sorted by ${col.label} ${SORT_DIR === 1 ? "(asc)" : "(desc)"} — click a column header to sort`;
}

function renderStatus(filterText) {
  const body = document.getElementById("statusBody");
  const f = (filterText || "").toLowerCase();
  const showAll = document.getElementById("showAllToggle").checked;
  const typeFilter = document.getElementById("typeFilter").value;

  let rows = showAll ? AREAS : AREAS.filter(isTouched);
  if (typeFilter) rows = rows.filter(a => a.type === typeFilter);
  if (f) rows = rows.filter(a => a.name.toLowerCase().includes(f) || a.slug.includes(f));
  rows = rows.slice().sort(compareRows);

  const touchedTotal = AREAS.filter(isTouched).length;
  document.getElementById("areaCount").textContent =
    showAll ? `${rows.length} shown / ${AREAS.length} total` : `${rows.length} shown / ${touchedTotal} touched`;

  renderStatusHead();

  const shown = rows.slice(0, 800);
  body.innerHTML = shown.map(a => `
    <tr>
      <td>${a.name}</td>
      <td>${a.type}</td>
      ${mark(a.generated)}${mark(a.pushed)}${mark(a.scraped)}${mark(a.about)}${mark(a.processed)}${mark(a.staged)}${mark(a.promoted)}
    </tr>
  `).join("");
}

function renderActionSelect() {
  const sel = document.getElementById("actionSelect");
  const byCategory = {};
  ACTIONS.forEach(a => { (byCategory[a.category] = byCategory[a.category] || []).push(a); });
  sel.innerHTML = Object.entries(byCategory).map(([cat, items]) =>
    `<optgroup label="${cat}">` +
    items.map(a => `<option value="${a.id}">${a.label}</option>`).join("") +
    `</optgroup>`
  ).join("");
}

function currentAction() {
  return ACTIONS.find(a => a.id === document.getElementById("actionSelect").value);
}

function updateAreaPickerVisibility() {
  const action = currentAction();
  const picker = document.getElementById("areaPicker");
  picker.style.display = (action && action.needs_area) ? "" : "none";
  if (!action || !action.needs_area) {
    SELECTED_SLUG = null;
    document.getElementById("areaInput").value = "";
  }
}

// Pick next/Pick 5 only make sense while queuing up single-area "prep" runs
// — hidden for every other action (including prep_bulk itself, once a pick
// has already been made) so they don't imply they apply more broadly.
function updatePickButtonsVisibility() {
  const action = currentAction();
  const show = action && action.id === "prep";
  document.getElementById("pickNextBtn").style.display = show ? "" : "none";
  document.getElementById("pick5Btn").style.display = show ? "" : "none";
}

function renderParamBox() {
  const actionId = document.getElementById("actionSelect").value;
  const defs = PARAM_DEFS[actionId] || [];
  document.getElementById("paramBox").innerHTML = defs.map(p =>
    `<label class="chk"><input type="checkbox" data-param="${p.key}"> ${p.label}</label>`
  ).join(" ");
  document.querySelectorAll("#paramBox input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", updatePreview);
  });
}

function buildParams() {
  const params = {};
  document.querySelectorAll("#paramBox input[type=checkbox]").forEach(cb => {
    params[cb.dataset.param] = cb.checked;
  });
  const action = currentAction();
  if (action && action.id === "prep_bulk") params.names = BULK_NAMES;
  return params;
}

// Calls the SAME build_command() the real run uses (via /api/preview), so
// this can never drift from what actually executes — never a client-side
// guess at the command string.
let PREVIEW_TOKEN = 0;

async function updatePreview() {
  const box = document.getElementById("cmdPreview");
  const action = currentAction();
  if (!action) { box.textContent = "$ …"; box.className = "cmd-preview"; return; }
  if (action.needs_area && !SELECTED_SLUG) {
    box.textContent = "$ (pick an area to preview the command)";
    box.className = "cmd-preview pending";
    return;
  }

  const params = buildParams();
  const token = ++PREVIEW_TOKEN;
  box.textContent = "$ …";
  box.className = "cmd-preview pending";
  try {
    const res = await fetch("/api/preview", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action_id: action.id, slug: SELECTED_SLUG, params}),
    });
    if (token !== PREVIEW_TOKEN) return; // a newer request has since superseded this one
    const data = await res.json();
    if (!res.ok) {
      box.textContent = `Error: ${data.error}`;
      box.className = "cmd-preview err";
    } else {
      box.textContent = `$ ${data.command}`;
      box.className = "cmd-preview";
    }
  } catch (e) {
    if (token !== PREVIEW_TOKEN) return;
    box.textContent = `Preview failed: ${e}`;
    box.className = "cmd-preview err";
  }
}

function renderSuggestions(query) {
  const box = document.getElementById("areaSuggestions");
  const q = query.trim().toLowerCase();
  // Empty query -> browse the full list (sorted, capped, scrollable) like a
  // real dropdown; typing narrows it, same as before.
  const pool = q ? AREAS.filter(a => a.name.toLowerCase().includes(q) || a.slug.includes(q)) : AREAS;
  const sorted = pool.slice().sort((a, b) => a.name.localeCompare(b.name));
  const matches = sorted.slice(0, q ? 40 : 200);
  if (matches.length === 0) {
    box.innerHTML = `<div class="none">No matches</div>`;
  } else {
    box.innerHTML = matches.map(a =>
      `<div data-slug="${a.slug}"><span>${a.name}</span><span class="type-tag">${a.type}</span></div>`
    ).join("");
    if (!q && pool.length > matches.length) {
      box.innerHTML += `<div class="none">…and ${pool.length - matches.length} more — type to narrow down</div>`;
    }
  }
  box.classList.add("open");
}

function initAreaPicker() {
  const input = document.getElementById("areaInput");
  const box = document.getElementById("areaSuggestions");

  input.addEventListener("input", () => { SELECTED_SLUG = null; renderSuggestions(input.value); });
  input.addEventListener("focus", () => renderSuggestions(input.value));
  input.addEventListener("click", () => renderSuggestions(input.value));
  document.addEventListener("click", (e) => {
    if (!document.getElementById("areaPicker").contains(e.target)) box.classList.remove("open");
  });
  box.addEventListener("click", (e) => {
    const row = e.target.closest("[data-slug]");
    if (!row) return;
    const area = AREAS.find(a => a.slug === row.dataset.slug);
    SELECTED_SLUG = area.slug;
    input.value = area.name;
    box.classList.remove("open");
    updatePreview();
  });
}

async function loadStatus() {
  const res = await fetch("/api/status");
  const data = await res.json();
  AREAS = data.areas;
  ACTIONS = data.actions;
  renderActionSelect();
  updateAreaPickerVisibility();
  updatePickButtonsVisibility();
  renderParamBox();
  renderBulkList();
  renderStatus(document.getElementById("filterBox").value);
  updatePreview();
}

function appendLog(text, cls) {
  const log = document.getElementById("log");
  if (log.textContent === "(nothing run yet)") log.textContent = "";
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text;
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}

async function runAction() {
  const action = currentAction();
  if (action && action.needs_area && !SELECTED_SLUG) {
    appendLog("Pick an area from the search box first.\n", "exit-bad");
    return;
  }
  const params = buildParams();

  const btn = document.getElementById("runBtn");
  btn.disabled = true;
  document.getElementById("killBtn").disabled = false;
  document.getElementById("stdinInput").disabled = false;
  document.getElementById("stdinSendBtn").disabled = false;
  document.getElementById("log").textContent = "";
  appendLog("Starting...\n");

  try {
    const res = await fetch("/api/run", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action_id: action.id, slug: SELECTED_SLUG, params}),
    });
    if (!res.ok) {
      const err = await res.json();
      appendLog(`Error: ${err.error}\n`, "exit-bad");
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let first = true;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      let text = decoder.decode(value, {stream: true});
      if (first) {
        appendLog(text, "cmd");
        first = false;
      } else {
        appendLog(text);
      }
    }
  } catch (e) {
    appendLog(`Request failed: ${e}\n`, "exit-bad");
  } finally {
    btn.disabled = false;
    document.getElementById("killBtn").disabled = true;
    document.getElementById("stdinInput").disabled = true;
    document.getElementById("stdinSendBtn").disabled = true;
    loadStatus();
  }
}

async function sendStdin() {
  const input = document.getElementById("stdinInput");
  const text = input.value;
  input.value = "";
  appendLog(`\n> ${text}\n`, "cmd");
  try {
    const res = await fetch("/api/stdin", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text}),
    });
    const data = await res.json();
    if (!data.ok) appendLog(`[${data.message}]\n`, "exit-bad");
  } catch (e) {
    appendLog(`Send failed: ${e}\n`, "exit-bad");
  }
}

async function killCurrent() {
  const killBtn = document.getElementById("killBtn");
  killBtn.disabled = true;
  try {
    const res = await fetch("/api/kill", {method: "POST"});
    const data = await res.json();
    appendLog(`\n[${data.message}]\n`, data.ok ? "cmd" : "exit-bad");
  } catch (e) {
    appendLog(`\nStop request failed: ${e}\n`, "exit-bad");
  }
  // Left disabled — the run's own `finally` re-enables it if something is
  // still (or newly) running; avoids a stale-enabled button after a stop.
}

document.getElementById("actionSelect").addEventListener("change", () => {
  if (currentAction() && currentAction().id !== "prep_bulk") BULK_NAMES = [];
  updateAreaPickerVisibility();
  updatePickButtonsVisibility();
  renderParamBox();
  renderBulkList();
  updatePreview();
});
document.getElementById("runBtn").addEventListener("click", runAction);
document.getElementById("killBtn").addEventListener("click", killCurrent);
document.getElementById("stdinSendBtn").addEventListener("click", sendStdin);
document.getElementById("stdinInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendStdin();
});
document.getElementById("pickNextBtn").addEventListener("click", pickNext);
document.getElementById("pick5Btn").addEventListener("click", pick5);
document.getElementById("filterBox").addEventListener("input", e => renderStatus(e.target.value));
document.getElementById("showAllToggle").addEventListener("change", () => renderStatus(document.getElementById("filterBox").value));
document.getElementById("typeFilter").addEventListener("change", () => renderStatus(document.getElementById("filterBox").value));
initAreaPicker();
loadStatus();
</script>
</body>
</html>
